[project]
name = "streaky"
version = "0.6.2"
description = "A terminal-first daily task manager with streaks, holidays, notes, and activity tracking."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50",
]

[project.scripts]
streaky = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
